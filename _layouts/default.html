<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />

    <link
      rel="alternate"
      type="application/rss+xml"
      title="{{ site.name }} - {{ site.description }}"
      href="{{ site.baseurl }}/feed.xml"
    />
  </head>


  <body>

    <!-- =========================================
         HEADER
         ========================================= -->

    <div class="wrapper-masthead">

      <div class="container">

        <header class="masthead clearfix">

          <a
            href="{{ site.baseurl }}/"
            class="site-avatar"
          >
            <img
              src="{{ site.avatar }}"
              alt="{{ site.name }}"
            />
          </a>


          <div class="site-info">

            <h1 class="site-name">

              <a href="{{ site.baseurl }}/">
                {{ site.name }}
              </a>

            </h1>


            <p class="site-description">
              {{ site.description }}
            </p>

          </div>


          <nav>

            <a href="{{ site.baseurl }}/">
              Blog
            </a>

            <a href="{{ site.baseurl }}/about">
              About
            </a>

          </nav>

        </header>

      </div>

    </div>


    <!-- =========================================
         MAIN CONTENT
         ========================================= -->

    <div
      id="main"
      role="main"
      class="container"
    >

      {{ content }}

    </div>


    <!-- =========================================
         FOOTER
         ========================================= -->

    <div class="wrapper-footer">

      <div class="container">

        <footer class="footer">

          {% include svg-icons.html %}

        </footer>

      </div>

    </div>


    {% include analytics.html %}



    <!-- =========================================
         REAL FLOWING PIRATE FLAGS
         ========================================= -->

    <div
      id="pirate-rain"
      aria-hidden="true"
    ></div>


    <style>

      /* -----------------------------------------
         Pirate rain container
         ----------------------------------------- */

      #pirate-rain {

        position: fixed;

        inset: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        pointer-events: none;

        z-index: 99999;

      }


      /* -----------------------------------------
         Individual flag
         ----------------------------------------- */

      .pirate-piece {

        position: absolute;

        top: -180px;

        left: 0;

        width: 95px;

        height: 85px;

        opacity: 0;

        will-change:
          transform,
          opacity;

        animation:
          pirate-drop
          var(--fall-time)
          cubic-bezier(.18,.65,.25,1)
          var(--delay)
          forwards;

      }


      /* -----------------------------------------
         Pole
         ----------------------------------------- */

      .pirate-pole {

        stroke: #777;

        stroke-width: 3;

        stroke-linecap: round;

      }


      /* -----------------------------------------
         Flag fabric
         ----------------------------------------- */

      .pirate-cloth {

        filter:
          url("#cloth-wave");

      }


      /* -----------------------------------------
         Falling movement
         ----------------------------------------- */

      @keyframes pirate-drop {

        0% {

          opacity: 0;

          transform:
            translate3d(
              var(--x),
              -160px,
              0
            )
            rotate(
              var(--start-rotation)
            )
            scale(
              var(--scale)
            );

        }


        8% {

          opacity: 1;

        }


        25% {

          transform:
            translate3d(
              calc(
                var(--x) +
                var(--sway-1)
              ),
              25vh,
              0
            )
            rotate(
              var(--rotation-1)
            )
            scale(
              var(--scale)
            );

        }


        50% {

          transform:
            translate3d(
              calc(
                var(--x) +
                var(--sway-2)
              ),
              55vh,
              0
            )
            rotate(
              var(--rotation-2)
            )
            scale(
              var(--scale)
            );

        }


        75% {

          opacity: 1;

          transform:
            translate3d(
              calc(
                var(--x) +
                var(--sway-3)
              ),
              80vh,
              0
            )
            rotate(
              var(--rotation-3)
            )
            scale(
              var(--scale)
            );

        }


        100% {

          opacity: 0;

          transform:
            translate3d(
              calc(
                var(--x) +
                var(--sway-4)
              ),
              115vh,
              0
            )
            rotate(
              var(--end-rotation)
            )
            scale(
              var(--scale)
            );

        }

      }


      /* -----------------------------------------
         Mobile
         ----------------------------------------- */

      @media screen and (max-width: 700px) {

        .pirate-piece {

          width: 72px;

          height: 65px;

        }

      }

    </style>



    <script>

      document.addEventListener(
        "DOMContentLoaded",
        function () {


          /* -----------------------------------
             Only run on homepage
             ----------------------------------- */

          const path =
            window.location.pathname;

          const homePath =
            "{{ site.baseurl }}/";


          const isHome =
            path === "/" ||
            path === homePath ||
            path === homePath.replace(/\/$/, "");


          if (!isHome) {

            return;

          }


          const rain =
            document.getElementById(
              "pirate-rain"
            );


          if (!rain) {

            return;

          }


          /* -----------------------------------
             Create SVG filter once
             ----------------------------------- */

          const filterSvg =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "svg"
            );


          filterSvg.setAttribute(
            "width",
            "0"
          );

          filterSvg.setAttribute(
            "height",
            "0"
          );


          filterSvg.innerHTML = `

            <defs>

              <filter
                id="cloth-wave"
                x="-30%"
                y="-30%"
                width="160%"
                height="160%"
              >

                <feTurbulence
                  type="fractalNoise"
                  baseFrequency="0.018 0.045"
                  numOctaves="2"
                  seed="8"
                  result="noise"
                >

                  <animate
                    attributeName="baseFrequency"
                    dur="2.2s"
                    values="
                      0.018 0.045;
                      0.026 0.060;
                      0.018 0.045
                    "
                    repeatCount="indefinite"
                  />

                </feTurbulence>


                <feDisplacementMap
                  in="SourceGraphic"
                  in2="noise"
                  scale="11"
                  xChannelSelector="R"
                  yChannelSelector="G"
                />

              </filter>

            </defs>

          `;


          document.body.appendChild(
            filterSvg
          );



          /* -----------------------------------
             Flag creation
             ----------------------------------- */

          const flagCount = 18;


          for (
            let i = 0;
            i < flagCount;
            i++
          ) {


            const flag =
              document.createElement("div");


            flag.className =
              "pirate-piece";


            /* --------------------------------
               Random values
               -------------------------------- */

            const x =
              Math.random() *
              window.innerWidth;


            const scale =
              0.65 +
              Math.random() *
              0.65;


            const fallTime =
              4.5 +
              Math.random() *
              2.5;


            const delay =
              Math.random() *
              2.5;


            const sway1 =
              (Math.random() - 0.5) *
              180;


            const sway2 =
              (Math.random() - 0.5) *
              300;


            const sway3 =
              (Math.random() - 0.5) *
              220;


            const sway4 =
              (Math.random() - 0.5) *
              350;


            const startRotation =
              (Math.random() - 0.5) *
              30;


            const rotation1 =
              (Math.random() - 0.5) *
              45;


            const rotation2 =
              (Math.random() - 0.5) *
              70;


            const rotation3 =
              (Math.random() - 0.5) *
              55;


            const endRotation =
              (Math.random() - 0.5) *
              90;



            /* --------------------------------
               CSS variables
               -------------------------------- */

            flag.style.setProperty(
              "--x",
              x + "px"
            );


            flag.style.setProperty(
              "--scale",
              scale
            );


            flag.style.setProperty(
              "--fall-time",
              fallTime + "s"
            );


            flag.style.setProperty(
              "--delay",
              delay + "s"
            );


            flag.style.setProperty(
              "--sway-1",
              sway1 + "px"
            );


            flag.style.setProperty(
              "--sway-2",
              sway2 + "px"
            );


            flag.style.setProperty(
              "--sway-3",
              sway3 + "px"
            );


            flag.style.setProperty(
              "--sway-4",
              sway4 + "px"
            );


            flag.style.setProperty(
              "--start-rotation",
              startRotation + "deg"
            );


            flag.style.setProperty(
              "--rotation-1",
              rotation1 + "deg"
            );


            flag.style.setProperty(
              "--rotation-2",
              rotation2 + "deg"
            );


            flag.style.setProperty(
              "--rotation-3",
              rotation3 + "deg"
            );


            flag.style.setProperty(
              "--end-rotation",
              endRotation + "deg"
            );



            /* --------------------------------
               SVG flag
               -------------------------------- */

            flag.innerHTML = `

              <svg
                viewBox="0 0 120 105"
                width="100%"
                height="100%"
                xmlns="http://www.w3.org/2000/svg"
              >


                <!-- Pole -->

                <line
                  class="pirate-pole"
                  x1="12"
                  y1="8"
                  x2="12"
                  y2="96"
                />


                <!-- Pole top -->

                <circle
                  cx="12"
                  cy="7"
                  r="4"
                  fill="#999"
                />


                <!-- Flag -->

                <path
                  class="pirate-cloth"
                  d="
                    M 14 12
                    C 35 8, 53 18, 72 13
                    C 88 9, 101 16, 114 12
                    L 114 58
                    C 95 63, 80 51, 65 57
                    C 46 64, 30 51, 14 56
                    Z
                  "
                  fill="#111"
                  stroke="#777"
                  stroke-width="1.5"
                />


                <!-- Skull -->

                <g
                  fill="#e7e7e7"
                  stroke="#111"
                  stroke-width="1"
                >

                  <circle
                    cx="57"
                    cy="32"
                    r="13"
                  />


                  <!-- Jaw -->

                  <path
                    d="
                      M 46 36
                      Q 57 49 68 36
                      L 66 44
                      L 48 44
                      Z
                    "
                  />


                  <!-- Left eye -->

                  <circle
                    cx="52"
                    cy="31"
                    r="3.5"
                    fill="#111"
                  />


                  <!-- Right eye -->

                  <circle
                    cx="62"
                    cy="31"
                    r="3.5"
                    fill="#111"
                  />


                  <!-- Nose -->

                  <path
                    d="
                      M 57 34
                      L 54 39
                      L 60 39
                      Z
                    "
                    fill="#111"
                  />

                </g>


                <!-- Crossbones -->

                <g
                  stroke="#e7e7e7"
                  stroke-width="4"
                  stroke-linecap="round"
                >

                  <line
                    x1="38"
                    y1="50"
                    x2="76"
                    y2="65"
                  />

                  <line
                    x1="76"
                    y1="50"
                    x2="38"
                    y2="65"
                  />

                </g>


              </svg>

            `;


            rain.appendChild(
              flag
            );


            /* --------------------------------
               Remove after animation
               -------------------------------- */

            setTimeout(
              function () {

                flag.remove();

              },
              (
                fallTime +
                delay +
                0.7
              ) * 1000
            );

          }


          /* -----------------------------------
             Remove whole animation
             ----------------------------------- */

          setTimeout(
            function () {

              if (rain) {

                rain.remove();

              }


              if (filterSvg) {

                filterSvg.remove();

              }

            },
            9000
          );

        }

      );

    </script>

  </body>
</html>
