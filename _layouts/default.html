<!DOCTYPE html>
<html>
  <head>

    <title>
      {% if page.title %}
        {{ page.title }} –
      {% endif %}
      {{ site.name }} – {{ site.description }}
    </title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link
      rel="stylesheet"
      type="text/css"
      href="{{ site.baseurl }}/style.css"
    />

    <link
      rel="alternate"
      type="application/rss+xml"
      title="{{ site.name }} - {{ site.description }}"
      href="{{ site.baseurl }}/feed.xml"
    />

  </head>


  <body>


    <!-- =========================================
         HEADER
         ========================================= -->

    <div class="wrapper-masthead">

      <div class="container">

        <header class="masthead clearfix">


          <!-- Avatar -->

          <a
            href="{{ site.baseurl }}/"
            class="site-avatar"
          >

            <img
              src="{{ site.avatar }}"
              alt="{{ site.name }}"
            >

          </a>


          <!-- Site information -->

          <div class="site-info">

            <h1 class="site-name">

              <a href="{{ site.baseurl }}/">
                {{ site.name }}
              </a>

            </h1>


            <p class="site-description">
              {{ site.description }}
            </p>

          </div>


          <!-- Navigation -->

          <nav>

            <a href="{{ site.baseurl }}/">
              Blog
            </a>

            <a href="{{ site.baseurl }}/about">
              About
            </a>

          </nav>


        </header>

      </div>

    </div>



    <!-- =========================================
         MAIN CONTENT
         ========================================= -->

    <div
      id="main"
      role="main"
      class="container"
    >

      {{ content }}

    </div>



    <!-- =========================================
         FOOTER
         ========================================= -->

    <div class="wrapper-footer">

      <div class="container">

        <footer class="footer">

          {% include svg-icons.html %}

        </footer>

      </div>

    </div>


    {% include analytics.html %}



    <!-- =========================================
         REALISTIC PIRATE FLAG
         ========================================= -->

    <div
      id="pirate-intro"
      aria-hidden="true"
    >

      <img
        src="{{ site.baseurl }}/images/pirate-flag.png"
        alt=""
        class="pirate-flag"
      >

    </div>



    <!-- =========================================
         PIRATE FLAG STYLING
         ========================================= -->

    <style>

      #pirate-intro {

        position: fixed;

        inset: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        pointer-events: none;

        z-index: 99999;

      }


      .pirate-flag {

        position: absolute;

        top: -260px;

        left: 50%;

        width: 430px;

        max-width: 42vw;

        height: auto;

        opacity: 0;

        transform-origin: 8% 8%;

        filter:
          drop-shadow(
            0 25px 30px
            rgba(0, 0, 0, 0.5)
          );

        will-change:
          transform,
          opacity;

        animation:
          pirate-journey 6s
          cubic-bezier(.22,.65,.24,1)
          forwards;

      }



      /* ========================================
         Main movement
         ======================================== */

      @keyframes pirate-journey {

        /* Start above the screen */

        0% {

          opacity: 0;

          transform:
            translate(
              -46vw,
              -250px
            )
            rotate(-16deg)
            scale(0.88);

        }


        /* Enter */

        8% {

          opacity: 1;

        }


        /* First drift */

        20% {

          transform:
            translate(
              -31vw,
              5vh
            )
            rotate(-8deg)
            scale(0.94);

        }


        /* Swing right */

        35% {

          transform:
            translate(
              -13vw,
              15vh
            )
            rotate(4deg)
            scale(0.99);

        }


        /* Central movement */

        50% {

          transform:
            translate(
              5vw,
              30vh
            )
            rotate(-4deg)
            scale(1);

        }


        /* Continue drifting */

        65% {

          transform:
            translate(
              17vw,
              47vh
            )
            rotate(6deg)
            scale(0.99);

        }


        /* Start disappearing */

        82% {

          opacity: 0.85;

          transform:
            translate(
              25vw,
              69vh
            )
            rotate(-4deg)
            scale(0.95);

        }


        /* Exit */

        100% {

          opacity: 0;

          transform:
            translate(
              35vw,
              115vh
            )
            rotate(8deg)
            scale(0.90);

        }

      }



      /* ========================================
         Very subtle rocking
         ======================================== */

      .pirate-flag {

        animation-name:
          pirate-journey,
          pirate-rock;

        animation-duration:
          6s,
          1.8s;

        animation-delay:
          0s,
          0s;

        animation-timing-function:
          cubic-bezier(.22,.65,.24,1),
          ease-in-out;

        animation-iteration-count:
          1,
          infinite;

        animation-fill-mode:
          forwards,
          both;

      }



      @keyframes pirate-rock {

        0% {

          margin-top: 0;

        }

        50% {

          margin-top: 5px;

        }

        100% {

          margin-top: 0;

        }

      }



      /* ========================================
         Mobile
         ======================================== */

      @media screen and (max-width: 700px) {

        .pirate-flag {

          width: 290px;

          max-width: 68vw;

          top: -180px;

        }

      }



      /* ========================================
         Reduced motion
         ======================================== */

      @media (prefers-reduced-motion: reduce) {

        .pirate-flag {

          animation: none;

          display: none;

        }

      }

    </style>



    <!-- =========================================
         PIRATE FLAG SCRIPT
         ========================================= -->

    <script>

      document.addEventListener(
        "DOMContentLoaded",
        function () {


          /*
             Only show the flag on the homepage.
          */

          const path =
            window.location.pathname;

          const basePath =
            "{{ site.baseurl }}/";


          const isHomepage =
            path === "/" ||
            path === basePath ||
            path ===
              basePath.replace(/\/$/, "");


          if (!isHomepage) {

            return;

          }


          /*
             Find the animation container.
          */

          const intro =
            document.getElementById(
              "pirate-intro"
            );


          if (!intro) {

            return;

          }


          /*
             Remove everything after
             the animation has finished.
          */

          setTimeout(
            function () {

              if (intro) {

                intro.remove();

              }

            },
            6500
          );


        }
      );

    </script>


  </body>
</html>
