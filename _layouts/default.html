<!DOCTYPE html>
<html>
  <head>

    <title>
      {% if page.title %}
        {{ page.title }} –
      {% endif %}
      {{ site.name }} – {{ site.description }}
    </title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link
      rel="stylesheet"
      type="text/css"
      href="{{ site.baseurl }}/style.css"
    />

    <link
      rel="alternate"
      type="application/rss+xml"
      title="{{ site.name }} - {{ site.description }}"
      href="{{ site.baseurl }}/feed.xml"
    />

  </head>

  <body>


    <!-- =========================================
         ONE-TIME PIRATE BACKGROUND
         ========================================= -->

    <div
      id="pirate-background"
      aria-hidden="true"
    >

      <img
        src="{{ site.baseurl }}/images/pirate-flag.png"
        alt=""
      >

    </div>


    <style>

      /* =========================================
         PIRATE BACKGROUND
         ========================================= */

      #pirate-background {

        position: fixed;

        inset: 0;

        display: flex;

        align-items: flex-start;

        justify-content: center;

        padding-top: 60px;

        overflow: hidden;

        pointer-events: none;

        z-index: 0;

        opacity: 0;

        animation:
          pirateIntro
          5.5s
          ease-in-out
          forwards;

      }


      #pirate-background img {

        display: block;

        width: 560px;

        max-width: 72vw;

        height: auto;

        opacity: 0.12;

        filter:
          drop-shadow(
            0 30px 50px
            rgba(0, 0, 0, 0.55)
          );

      }


      /* =========================================
         FADE
         ========================================= */

      @keyframes pirateIntro {

        0% {

          opacity: 0;

        }

        18% {

          opacity: 1;

        }

        55% {

          opacity: 1;

        }

        100% {

          opacity: 0;

        }

      }


      /* =========================================
         KEEP WEBSITE ABOVE FLAG
         ========================================= */

      .wrapper-masthead,
      #main,
      .wrapper-footer {

        position: relative;

        z-index: 1;

      }


      /* =========================================
         MOBILE
         ========================================= */

      @media screen and (max-width: 700px) {

        #pirate-background {

          padding-top: 80px;

        }


        #pirate-background img {

          width: 380px;

          max-width: 88vw;

          opacity: 0.10;

        }

      }


      /* =========================================
         REDUCED MOTION
         ========================================= */

      @media (
        prefers-reduced-motion: reduce
      ) {

        #pirate-background {

          display: none;

        }

      }

    </style>



    <!-- =========================================
         HEADER
         ========================================= -->

    <div class="wrapper-masthead">

      <div class="container">

        <header class="masthead clearfix">


          <!-- Avatar -->

          <a
            href="{{ site.baseurl }}/"
            class="site-avatar"
          >

            <img
              src="{{ site.avatar }}"
              alt="{{ site.name }}"
            >

          </a>


          <!-- Site name -->

          <div class="site-info">

            <h1 class="site-name">

              <a
                href="{{ site.baseurl }}/"
              >
                {{ site.name }}
              </a>

            </h1>


            <p class="site-description">
              {{ site.description }}
            </p>

          </div>


          <!-- Navigation -->

          <nav>

            <a
              href="{{ site.baseurl }}/"
            >
              Blog
            </a>

            <a
              href="{{ site.baseurl }}/about/"
            >
              About
            </a>

          </nav>


        </header>

      </div>

    </div>



    <!-- =========================================
         MAIN CONTENT
         ========================================= -->

    <div
      id="main"
      role="main"
      class="container"
    >

      {{ content }}

    </div>



    <!-- =========================================
         FOOTER
         ========================================= -->

    <div class="wrapper-footer">

      <div class="container">

        <footer class="footer">

          {% include svg-icons.html %}

        </footer>

      </div>

    </div>


    {% include analytics.html %}



    <!-- =========================================
         ONE-TIME FLAG SCRIPT
         ========================================= -->

    <script>

      (function () {

        "use strict";


        /*
         * This key remembers that the visitor
         * has already seen the pirate intro
         * during this browser session.
         */

        const storageKey =
          "porksandwitch-pirate-intro-seen";


        const pirate =
          document.getElementById(
            "pirate-background"
          );


        if (!pirate) {

          return;

        }


        let alreadySeen = false;


        /*
         * Check session storage.
         */

        try {

          alreadySeen =
            sessionStorage.getItem(
              storageKey
            ) === "true";

        } catch (error) {

          alreadySeen = false;

        }


        /*
         * Already seen?

         * Remove it immediately.
         */

        if (alreadySeen) {

          pirate.remove();

          return;

        }


        /*
         * Mark it as seen BEFORE the
         * animation starts.
         *
         * Because default.html is loaded
         * on every page, this prevents the
         * flag from appearing again when
         * navigating around the site.
         */

        try {

          sessionStorage.setItem(
            storageKey,
            "true"
          );

        } catch (error) {

          /* Ignore storage errors */

        }


        /*
         * Remove the flag completely after
         * the animation has finished.
         */

        window.setTimeout(
          function () {

            const currentPirate =
              document.getElementById(
                "pirate-background"
              );


            if (currentPirate) {

              currentPirate.remove();

            }

          },
          6000
        );

      })();

    </script>


  </body>
</html>
