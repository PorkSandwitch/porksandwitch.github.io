<!DOCTYPE html>
<html>
  <head>

    <title>
      {% if page.title %}
        {{ page.title }} –
      {% endif %}
      {{ site.name }} – {{ site.description }}
    </title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link
      rel="stylesheet"
      type="text/css"
      href="{{ site.baseurl }}/style.css"
    />

    <link
      rel="alternate"
      type="application/rss+xml"
      title="{{ site.name }} - {{ site.description }}"
      href="{{ site.baseurl }}/feed.xml"
    />

  </head>

  <body>


    <!-- =========================================
         SUBTLE ONE-TIME PIRATE BACKGROUND
         ========================================= -->

    <div
      id="pirate-background"
      aria-hidden="true"
    >

      <img
        src="{{ site.baseurl }}/images/pirate-flag.png"
        alt=""
      >

    </div>



    <!-- =========================================
         HEADER
         ========================================= -->

    <div class="wrapper-masthead">

      <div class="container">

        <header class="masthead clearfix">


          <a
            href="{{ site.baseurl }}/"
            class="site-avatar"
          >

            <img
              src="{{ site.avatar }}"
              alt="{{ site.name }}"
            >

          </a>


          <div class="site-info">

            <h1 class="site-name">

              <a href="{{ site.baseurl }}/">
                {{ site.name }}
              </a>

            </h1>


            <p class="site-description">
              {{ site.description }}
            </p>

          </div>


          <nav>

            <a href="{{ site.baseurl }}/">
              Blog
            </a>

            <a href="{{ site.baseurl }}/about/">
              About
            </a>

          </nav>


        </header>

      </div>

    </div>



    <!-- =========================================
         MAIN CONTENT
         ========================================= -->

    <div
      id="main"
      role="main"
      class="container"
    >

      {{ content }}

    </div>



    <!-- =========================================
         FOOTER
         ========================================= -->

    <div class="wrapper-footer">

      <div class="container">

        <footer class="footer">

          {% include svg-icons.html %}

        </footer>

      </div>

    </div>


    {% include analytics.html %}



    <!-- =========================================
         PIRATE BACKGROUND STYLING
         ========================================= -->

    <style>

      /*
       * The flag sits behind the website.
       */

      #pirate-background {

        position: fixed;

        top: 45px;
        left: 50%;

        width: 600px;

        max-width: 75vw;

        transform:
          translateX(-50%);

        pointer-events: none;

        z-index: 0;

        opacity: 0;

        animation:
          pirate-intro
          5.5s
          ease-in-out
          forwards;

      }


      #pirate-background img {

        display: block;

        width: 100%;

        height: auto;

        opacity: 0.12;

        filter:
          blur(0.2px)
          drop-shadow(
            0 30px 50px
            rgba(0, 0, 0, 0.5)
          );

      }


      /*
       * Fade in gently,
       * stay visible,
       * then disappear.
       */

      @keyframes pirate-intro {

        0% {

          opacity: 0;

        }


        18% {

          opacity: 1;

        }


        55% {

          opacity: 1;

        }


        100% {

          opacity: 0;

        }

      }


      /*
       * Keep the actual website
       * above the flag.
       */

      .wrapper-masthead,
      #main,
      .wrapper-footer {

        position: relative;

        z-index: 1;

      }


      /*
       * Mobile
       */

      @media screen and (max-width: 700px) {

        #pirate-background {

          top: 80px;

          width: 390px;

          max-width: 90vw;

        }


        #pirate-background img {

          opacity: 0.10;

        }

      }


      /*
       * Don't animate for users who
       * have reduced motion enabled.
       */

      @media (
        prefers-reduced-motion: reduce
      ) {

        #pirate-background {

          display: none;

        }

      }

    </style>



    <!-- =========================================
         ONE-TIME PIRATE INTRO SCRIPT
         ========================================= -->

    <script>

      (function () {

        "use strict";


        /*
         * Only show this on the homepage.
         */

        const currentPath =
          window.location.pathname;


        const basePath =
          "{{ site.baseurl }}/";


        const cleanBasePath =
          basePath.replace(
            /\/$/,
            ""
          );


        const isHomepage =
          currentPath === "/" ||
          currentPath === basePath ||
          currentPath === cleanBasePath;


        if (!isHomepage) {

          return;

        }


        /*
         * Unique localStorage key.
         */

        const storageKey =
          "porksandwitch-pirate-intro-seen";


        /*
         * Check whether the visitor
         * has already seen it.
         */

        let hasSeenIntro = false;


        try {

          hasSeenIntro =
            localStorage.getItem(
              storageKey
            ) === "true";

        } catch (error) {

          /*
           * Ignore storage errors.
           */

        }


        /*
         * Already seen?
         * Remove it immediately.
         */

        if (hasSeenIntro) {

          const pirate =
            document.getElementById(
              "pirate-background"
            );


          if (pirate) {

            pirate.remove();

          }


          return;

        }


        /*
         * Remember that this visitor
         * has now seen the intro.
         */

        try {

          localStorage.setItem(
            storageKey,
            "true"
          );

        } catch (error) {

          /*
           * Ignore storage errors.
           */

        }


        /*
         * Remove the element after
         * the animation has completed.
         */

        window.setTimeout(
          function () {

            const pirate =
              document.getElementById(
                "pirate-background"
              );


            if (pirate) {

              pirate.remove();

            }

          },
          6000
        );

      })();

    </script>


  </body>
</html>
