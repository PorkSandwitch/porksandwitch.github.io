#
# PorkSandwitch website configuration
#

# Name shown in the website header
name: PorkSandwitch

# Short description shown below the name
description: Cool stuff I find on the internet

# Your avatar / profile picture
# This uses your GitHub profile picture.
avatar: https://github.com/PorkSandwitch.png?size=256


#
# Footer links
#

footer-links:

  dribbble:

  email:

  facebook:

  flickr:

  github: PorkSandwitch

  instagram:

  linkedin:

  pinterest:

  rss: true

  twitter:

  stackoverflow:

  youtube:

  googleplus:


#
# Comments
#

# Add your Disqus shortname here later if you want comments.
disqus:


#
# Analytics
#

google_analytics:


#
# Website URL
#

url: https://porksandwitch.github.io

baseurl: ""


#
# Permalinks
#

permalink: /:title/


#
# Jekyll / Markdown
#

kramdown:
  input: GFM

syntax_highlighter: rouge

syntax_highlighter_opts:
  css_class: 'highlight'


#
# Sass
#

sass:
  style: :expanded


#
# Plugins
#

gems:
  - jekyll-sitemap
  - jekyll-feed


#
# Files excluded from the generated website
#

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
